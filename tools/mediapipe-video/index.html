<!doctype html><meta charset="utf-8"><h1>MediaPipe FULL CPU VIDEO benchmark</h1><p id="status">Loading</p><button id="run" disabled>Run150 CPU frames</button><button id="save" disabled>Download12-joint JSON</button><p>Local inference only. VIDEO includes vendor temporal smoothing. No clinical accuracy claim.</p><canvas id="overlay" width="786" height="478"></canvas><script type="module">
import {FilesetResolver,PoseLandmarker} from './vision_bundle.mjs';
const config=await(await fetch('./config.json')).json();const map={frames:Array.from({length:150},()=>({display_roi:config.profile.input_roi}))};window.results=[];window.map=map;window.landmarker=await PoseLandmarker.createFromOptions(await FilesetResolver.forVisionTasks('./wasm'),{baseOptions:{modelAssetPath:'./pose_landmarker_full.task',delegate:'CPU'},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5,outputSegmentationMasks:false});
const keys=['left_shoulder_1_joint','right_shoulder_1_joint','left_forearm_joint','right_forearm_joint','left_hand_joint','right_hand_joint','left_upLeg_joint','right_upLeg_joint','left_leg_joint','right_leg_joint','left_foot_joint','right_foot_joint'],ids=[11,12,13,14,15,16,23,24,25,26,27,28];
window.chunk=async(start,count=30)=>{if(start!==results.length)throw Error('Frames must be processed exactly once in order');for(let i=start;i<Math.min(150,start+count);i++){const img=new Image();img.src='./frames/frame-'+String(i).padStart(4,'0')+'.jpg';await img.decode();const t=performance.now(),r=landmarker.detectForVideo(img,i*1000/30),ms=performance.now()-t,roi=map.frames[i].display_roi,j={};if(r.landmarks[0])for(let k=0;k<12;k++){const p=r.landmarks[0][ids[k]];j[keys[k]]={x:roi.x+p.x*roi.w,y:roi.y+p.y*roi.h,crop_x:p.x,crop_y:p.y,confidence:p.visibility,visibility:p.visibility,presence:p.presence};}results.push({index:i,source_index:i+180,source_frame_zero_based:i+180,source_time_s:(i+180)/30,clip_time_s:i/30,timestamp_ms:i*1000/30,candidates:r.landmarks.length,inference_ms:ms,display_roi:roi,joints:j});document.querySelector('#status').textContent='Completed '+results.length+'/150';}return {frames:results.length,last:results.at(-1).inference_ms}};
window.drawSample=async(indices=[0,74,149])=>{const c=document.querySelector('canvas'),ctx=c.getContext('2d'),W=config.profile.input_roi.w,H=config.profile.input_roi.h;c.width=W*indices.length;c.height=H;for(let n=0;n<indices.length;n++){let i=indices[n],im=new Image();im.src='./frames/frame-'+String(i).padStart(4,'0')+'.jpg';await im.decode();ctx.drawImage(im,W*n,0,W,H);ctx.fillStyle='yellow';ctx.font='16px sans-serif';ctx.fillText('Frame '+(i+180),W*n+10,20);const j=results[i].joints;ctx.strokeStyle='#00ffff';ctx.lineWidth=2;for(const[a,b]of[[0,1],[0,2],[2,4],[1,3],[3,5],[0,6],[1,7],[6,7],[6,8],[8,10],[7,9],[9,11]]){const p=j[keys[a]],q=j[keys[b]];if(p?.confidence>=.3&&q?.confidence>=.3){ctx.beginPath();ctx.moveTo(n*W+p.crop_x*W,p.crop_y*H);ctx.lineTo(n*W+q.crop_x*W,q.crop_y*H);ctx.stroke()}}}return c.toDataURL('image/png');};document.querySelector('#status').textContent='Ready';document.querySelector('#run').disabled=false;document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{for(let i=0;i<150;i+=30)await chunk(i,30);document.querySelector('#save').disabled=false}catch(e){document.querySelector('#status').textContent='FAILED: '+e.message}};document.querySelector('#save').onclick=()=>{const o={fps:config.profile.fps,source_video:config.profile.source,metadata:{...config.metadata,mapping:'Fixed400x700ROI: original x=460+crop_x*400,y=220+crop_y*700',profile:config.profile},frames:results},u=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='mediapipe-fixed-video.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};</script>
